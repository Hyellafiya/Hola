<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AIOWtech Redirect</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    .container{
      text-align:center;
      background:rgba(255,255,255,0.05);
      padding:40px;
      border-radius:20px;
      backdrop-filter:blur(10px);
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    h1{
      margin-bottom:15px;
      font-size:2rem;
    }

    p{
      margin-bottom:25px;
      color:#cbd5e1;
    }

    button{
      padding:15px 30px;
      border:none;
      border-radius:12px;
      background:#3b82f6;
      color:white;
      font-size:1rem;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#2563eb;
      transform:scale(1.05);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Hola 😁</h1>
    <p>Click the button below </p>

    <button onclick="goToSite()">
      click here
    </button>
  </div>

  <script>
    function goToSite() {
      window.location.href = "https://hyellafiya.github.io/Unknown-/";
    }
  </script>

</body>
</html>
